services:
  statik:
    image: ghcr.io/corp-0/statik:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # Trust X-Forwarded-For/Proto only from the shared cloudflared's fixed address on the tunnel network.
      ForwardedHeaders__KnownProxies__0: 10.213.0.2
      ConnectionStrings__Statik: "Host=statik-db;Port=5432;Database=statik;Username=statik"
      Smtp__Host: smtp.resend.com
      Smtp__Port: "587"
      Smtp__Security: StartTls
      Smtp__Username: resend
      Smtp__Password: "${RESEND_API_KEY:?Set RESEND_API_KEY in the deployment .env file}"
      Smtp__From: "${STATIK_EMAIL_FROM:-Statik <noreply@statik.club>}"
    labels:
      # Watchtower pulls new :latest images and replaces this container; the app migrates on startup.
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      statik-db:
        condition: service_healthy
    networks:
      - tunnel
      - database

  statik-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: statik
      POSTGRES_USER: statik
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    configs:
      - source: postgres-auth
        target: /etc/postgresql/pg_hba.conf
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statik -d statik"]
      interval: 2s
      timeout: 5s
      retries: 15

configs:
  postgres-auth:
    content: |
      local all all trust
      host all all all trust

networks:
  # Shared with the standalone cloudflared stack, which has the fixed address 10.213.0.2.
  # Created once on the host: docker network create --subnet 10.213.0.0/24 tunnel
  tunnel:
    external: true
  database:
    internal: true

volumes:
  postgres-data:
